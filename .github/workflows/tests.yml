# Clean install of dependencies, build and full test run (mocha + jest + types)
# across supported Node.js versions and mocha majors.

name: Tests CI

on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [18.x, 20.x, 22.x, 24.x]
                mocha-version: [10.x, latest]
        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
            - run: npm ci
            - run: npm install --no-save mocha@${{ matrix.mocha-version }}
            - run: npm test
